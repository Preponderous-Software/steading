name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    # The colony rules and mod manifests are USD-free, so these jobs need no
    # OpenUSD and finish in about a minute. The pinned state fingerprint in
    # test_determinism must match on every compiler below.
    name: rules (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-13, os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, flags: "" }
          - { name: clang-18, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, flags: "" }
          - { name: asan-ubsan, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18,
              flags: "-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" }
          - { name: msvc, os: windows-2022, cc: "", cxx: "", flags: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          FLAGS: ${{ matrix.flags }}
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DSTEADING_WARNINGS_AS_ERRORS=ON)
          # Only override the flags when sanitizing: an empty CMAKE_CXX_FLAGS
          # would drop MSVC's defaults (/EHsc).
          if [ -n "$FLAGS" ]; then args+=("-DCMAKE_CXX_FLAGS=$FLAGS" "-DCMAKE_EXE_LINKER_FLAGS=$FLAGS"); fi
          cmake -S . -B build "${args[@]}"
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Simulate (smoke + rate)
        shell: bash
        run: |
          bin=build/steading-sim; [ -f build/Release/steading-sim.exe ] && bin=build/Release/steading-sim.exe
          "$bin" --ticks 1000
          "$bin" --settlers 1000 --max 1000 --size 160 --ticks 300
      - name: History replay (usd-replay/1)
        if: matrix.name == 'gcc-13'
        run: |
          build/steading-replay --new 42 --ticks 1000 --every 4 --version "${GITHUB_SHA::12}" --out replay.usda
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "usd-recorder @ git+https://github.com/Preponderous-Software/usd-recorder@v0.2.0"
          "$RUNNER_TEMP/venv/bin/usd-recorder" replay validate replay.usda
          "$RUNNER_TEMP/venv/bin/usd-recorder" replay convert replay.usda steading-seed42.usdc
          # The replay's last state hash is the pinned fingerprint of test_determinism (seed 42, 1000 ticks).
          grep -q '1000: "011ed2b2f364b21b"' replay.usda
      - name: Upload the replay
        if: matrix.name == 'gcc-13'
        uses: actions/upload-artifact@v4
        with:
          name: steading-replay-seed42
          path: steading-seed42.usdc

  game:
    # The playable game on Strata, with saves through Strata's save core. OpenUSD
    # is never built here: the prebuilt install Strata's CI publishes for its
    # pinned OpenUSD (a release asset of the strata repository, keyed by
    # Strata's modules/usd/openusd lock) is downloaded and cached.
    name: game on Strata (saves soak, headless smoke)
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
    steps:
      - name: Install toolchain, SDL3 build dependencies and Mesa
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git curl python3 build-essential cmake zstd pkg-config \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libegl1 libegl-mesa0 libgl1-mesa-dri libgl1

      - uses: actions/checkout@v4

      - name: Check out the pinned Strata
        run: |
          ref="$(tr -d '[:space:]' < strata.ref)"
          git init -q "$RUNNER_TEMP/strata"
          git -C "$RUNNER_TEMP/strata" fetch -q --depth 1 https://github.com/Preponderous-Software/strata.git "$ref"
          git -C "$RUNNER_TEMP/strata" checkout -q FETCH_HEAD
          echo "STRATA_DIR=$RUNNER_TEMP/strata" >> "$GITHUB_ENV"
          echo "OPENUSD_KEY=$(bash "$RUNNER_TEMP/strata/modules/usd/openusd/key.sh")" >> "$GITHUB_ENV"

      - name: Restore the OpenUSD prebuilt
        id: cache
        uses: actions/cache@v4
        with:
          path: openusd-dist
          key: ${{ env.OPENUSD_KEY }}

      - name: Download the OpenUSD prebuilt
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p openusd-dist
          curl -fsSL -o "openusd-dist/${OPENUSD_KEY}.tar.gz" \
            "https://github.com/Preponderous-Software/strata/releases/download/${OPENUSD_KEY}/${OPENUSD_KEY}.tar.gz"

      - name: Configure
        run: |
          mkdir -p /opt/openusd && tar -C /opt/openusd -xzf "openusd-dist/${OPENUSD_KEY}.tar.gz"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTEADING_WARNINGS_AS_ERRORS=ON \
            -DSTEADING_WITH_STRATA=ON -DFETCHCONTENT_SOURCE_DIR_STRATA="$STRATA_DIR" \
            -DCMAKE_PREFIX_PATH="/opt/openusd/${OPENUSD_KEY}" -Wno-dev

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test (rules and saves through Strata)
        run: ctest --test-dir build --output-on-failure

      - name: Headless smoke (EGL + llvmpipe)
        run: |
          build/steading --slot "$RUNNER_TEMP/slot" --new 42 --headless --ticks 400 --screenshot steading-400.png
          build/steading --slot "$RUNNER_TEMP/slot" --headless --ticks 100 --screenshot steading-500.png

      - name: History replay from a save is read-only and matches a fresh run
        run: |
          (cd "$RUNNER_TEMP/slot" && sha256sum * | sort) > before.txt
          build/steading-replay --slot "$RUNNER_TEMP/slot" --ticks 200 --every 5 --out from-save.usda
          (cd "$RUNNER_TEMP/slot" && sha256sum * | sort) > after.txt
          diff before.txt after.txt
          build/steading-replay --new 42 --ticks 700 --every 5 --out fresh.usda
          python3 - <<'PY'
          import re
          def hashes(path):
              text = open(path).read()
              block = re.search(r"replay:stateHash.timeSamples = \{(.*?)\}", text, re.S).group(1)
              return dict(re.findall(r'(\d+): "([0-9a-f]+)"', block))
          fresh, saved = hashes("fresh.usda"), hashes("from-save.usda")
          shared = sorted(set(fresh) & set(saved), key=int)
          assert len(shared) == 41 and shared[0] == "500", shared[:3]
          assert all(fresh[t] == saved[t] for t in shared), "the history from the save differs from a fresh run"
          print(f"{len(shared)} shared samples from tick {shared[0]}: identical state hashes")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steading-screenshots
          path: steading-*.png
          if-no-files-found: ignore
