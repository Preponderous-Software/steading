name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    # The colony rules and mod manifests are USD-free, so these jobs need no
    # OpenUSD and finish in about a minute. The pinned state fingerprint in
    # test_determinism must match on every compiler below.
    name: rules (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-13, os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, flags: "" }
          - { name: clang-18, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, flags: "" }
          - { name: asan-ubsan, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18,
              flags: "-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" }
          - { name: msvc, os: windows-2022, cc: "", cxx: "", flags: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTEADING_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Simulate (smoke + rate)
        shell: bash
        run: |
          bin=build/steading-sim; [ -f build/Release/steading-sim.exe ] && bin=build/Release/steading-sim.exe
          "$bin" --ticks 1000
          "$bin" --settlers 1000 --max 1000 --size 160 --ticks 300
